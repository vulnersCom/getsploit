name: Scorecard

# OpenSSF Scorecard grades this repository's supply-chain posture: pinned actions,
# branch protection, token permissions, signed releases. The result feeds the badge in
# README.md and the code-scanning tab.
on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

jobs:
  analysis:
    name: Analyze supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write # Publishes the result to the public Scorecard API for the badge.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
